
<!DOCTYPE html>
<html>
<head>
    <title>Stock Data Visualizer</title>
</head>
<body>
    <h1>Stock Data Visualizer</h1>

    <form method="POST">

        <label for="symbol">Choose a Stock:</label>
        <select name="symbol" id="symbol" required>
            {% for stock in stocks %}
                <option value="{{ stock.symbol }}"
                    {% if request.form.get('symbol') == stock.symbol %}
                        selected
                    {% endif %}>
                    {{ stock.name }} ({{ stock.symbol }})
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="chart_type">Chart Type:</label>
        <select name="chart_type" id="chart_type" required>
            <option value="line"
                {% if request.form.get('chart_type') == 'line' %}selected{% endif %}>
                Line Chart
            </option>
            <option value="bar"
                {% if request.form.get('chart_type') == 'bar' %}selected{% endif %}>
                Bar Chart
            </option>
        </select>

        <br><br>

        <label for="time_series">Time Series:</label>
        <select name="time_series" id="time_series" required>
            <option value="1"
                {% if request.form.get('time_series') == '1' %}selected{% endif %}>
                Intraday
            </option>
            <option value="2"
                {% if request.form.get('time_series') == '2' %}selected{% endif %}>
                Daily
            </option>
            <option value="3"
                {% if request.form.get('time_series') == '3' %}selected{% endif %}>
                Weekly
            </option>
            <option value="4"
                {% if request.form.get('time_series') == '4' %}selected{% endif %}>
                Monthly
            </option>
        </select>

        <br><br>

        <label for="start_date">Start Date:</label>
        <input type="date"
               name="start_date"
               id="start_date"
               value="{{ request.form.get('start_date', '') }}"
               required>

        <br><br>

        <label for="end_date">End Date:</label>
        <input type="date"
               name="end_date"
               id="end_date"
               value="{{ request.form.get('end_date', '') }}"
               required>

        <br><br>

        <button type="submit">Generate Chart</button>

    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if chart %}
        <h2>Stock Chart</h2>
        <div>
            {{ chart | safe }}
        </div>
    {% endif %}

</body>
</html>
